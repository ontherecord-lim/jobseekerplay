name: Publish jobseekerplay v1.0.0

on:
  push:
    branches: [release-v1.0.0]
    paths: [.github/workflows/publish-v1.0.0.yml]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish first release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ontherecord-lim/jobseekerplay
          RELEASE_TAG: v1.0.0
          RELEASE_TARGET: 9c772cacee3d4449490a88740e0ff55d2dd1e5ae
        run: |
          set -eu
          cat > "$RUNNER_TEMP/jobseekerplay-notes.md" <<\'NOTES\'
          취준생 키우기의 첫 공개 릴리스입니다.

          - 가구를 눌러 취업 준비를 하거나, 식사하고 쉬고 산책할 수 있어요.
          - 부모님과 대화하고 전공에 맞는 채용 공고와 알바를 둘러볼 수 있어요. 진행 기록은 브라우저에 저장돼요.
          - 방 꾸미기에서 벽지와 이불, 러그 색이 바로 바뀌어요. 공원에서 테마를 골라도 집으로 돌아와 결과를 확인할 수 있어요.

          [취준생 키우기 플레이](https://ontherecord-lim.github.io/jobseekerplay/)
          NOTES
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --target "$RELEASE_TARGET" --title "취준생 키우기 v1.0.0" --notes-file "$RUNNER_TEMP/jobseekerplay-notes.md"
